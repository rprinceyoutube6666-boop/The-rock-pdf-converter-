<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Rock PDF Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#111827;
}

header{
background:#111827;
color:white;
padding:25px 15px;
text-align:center;
}

header h1{
margin:0;
font-size:27px;
}

header p{
margin:8px 0 0;
color:#cbd5e1;
}

.container{
max-width:750px;
margin:25px auto;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:18px;
}

.upload{
border:2px dashed #64748b;
text-align:center;
padding:30px 15px;
border-radius:14px;
}

.upload input{
margin-top:15px;
width:100%;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

label{
font-weight:bold;
font-size:14px;
}

select{
width:100%;
padding:11px;
margin-top:6px;
border:1px solid #cbd5e1;
border-radius:8px;
background:white;
}

#preview{
display:flex;
flex-direction:column;
gap:14px;
}

.photo{
display:flex;
align-items:center;
gap:12px;
background:#f8fafc;
padding:10px;
border-radius:12px;
border:1px solid #e2e8f0;
}

.photo img{
width:100px;
height:100px;
object-fit:contain;
background:#e5e7eb;
border-radius:8px;
}

.info{
flex:1;
min-width:0;
}

.info strong{
display:block;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.buttons{
display:flex;
gap:5px;
margin-top:8px;
flex-wrap:wrap;
}

.buttons button{
border:0;
padding:7px 9px;
border-radius:7px;
cursor:pointer;
}

.up{background:#dbeafe}
.down{background:#fef3c7}
.rotate{background:#dcfce7}
.delete{background:#fee2e2}

#convert{
width:100%;
padding:17px;
border:0;
border-radius:11px;
background:#16a34a;
color:white;
font-size:18px;
font-weight:bold;
margin-top:18px;
}

#convert:disabled{
background:#94a3b8;
}

#count{
text-align:center;
color:#64748b;
margin:10px 0;
}

@media(max-width:500px){
.options{
grid-template-columns:1fr;
}

.photo img{
width:80px;
height:80px;
}
}
</style>
</head>

<body>

<header>
<h1>THE ROCK PDF CONVERTER</h1>
<p>Photo ko PDF mein badlein — Fast & Free</p>
</header>

<div class="container">

<div class="card">
<div class="upload">
<h2>📷 Photos Select Karein</h2>
<p>JPG, JPEG ya PNG photos choose karein</p>
<input id="photos" type="file" accept="image/jpeg,image/png" multiple>
</div>
</div>

<div class="card">
<h3>⚙️ PDF Settings</h3>

<div class="options">

<div>
<label>Page Size</label>
<select id="pageSize">
<option value="a4">A4</option>
<option value="original">Original Photo Size</option>
</select>
</div>

<div>
<label>Orientation</label>
<select id="orientation">
<option value="portrait">Portrait</option>
<option value="landscape">Landscape</option>
</select>
</div>

<div>
<label>PDF Quality</label>
<select id="quality">
<option value="1">High Quality</option>
<option value="0.75">Medium</option>
<option value="0.55">Small File</option>
</select>
</div>

</div>
</div>

<div class="card">
<h3>🖼️ Selected Photos</h3>
<div id="count">0 photos selected</div>
<div id="preview"></div>

<button id="convert" disabled>
📄 Convert & Download PDF
</button>
</div>

</div>

<script>

const input=document.getElementById("photos");
const preview=document.getElementById("preview");
const convert=document.getElementById("convert");
const count=document.getElementById("count");

let files=[];

input.addEventListener("change",()=>{
files=Array.from(input.files);
render();
});

function render(){

preview.innerHTML="";

count.innerText=files.length+" photo"+(files.length===1?"":"s")+" selected";

convert.disabled=files.length===0;

files.forEach((file,index)=>{

const reader=new FileReader();

reader.onload=e=>{

const div=document.createElement("div");

div.className="photo";

div.innerHTML=`
<img src="${e.target.result}" id="img${index}">
<div class="info">
<strong>${index+1}. ${file.name}</strong>

<div class="buttons">

<button class="up" onclick="moveUp(${index})">⬆️</button>

<button class="down" onclick="moveDown(${index})">⬇️</button>

<button class="rotate" onclick="rotatePhoto(${index})">🔄 Rotate</button>

<button class="delete" onclick="removePhoto(${index})">🗑️ Delete</button>

</div>
</div>
`;

preview.appendChild(div);

};

reader.readAsDataURL(file);

});

}

function removePhoto(index){

files.splice(index,1);
render();

}

function moveUp(index){

if(index===0)return;

[files[index-1],files[index]]=
[files[index],files[index-1]];

render();

}

function moveDown(index){

if(index===files.length-1)return;

[files[index+1],files[index]]=
[files[index],files[index+1]];

render();

}

function rotatePhoto(index){

const img=document.getElementById("img"+index);

let rotation=parseInt(img.dataset.rotation||"0");

rotation+=90;

img.dataset.rotation=rotation;

img.style.transform="rotate("+rotation+"deg)";

}

function readFile(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>resolve(reader.result);

reader.onerror=reject;

reader.readAsDataURL(file);

});

}

function loadImage(src){

return new Promise((resolve,reject)=>{

const img=new Image();

img.onload=()=>resolve(img);

img.onerror=reject;

img.src=src;

});

}

convert.addEventListener("click",async()=>{

if(files.length===0)return;

const {jsPDF}=window.jspdf;

const size=document.getElementById("pageSize").value;

const orientation=document.getElementById("orientation").value;

const quality=parseFloat(document.getElementById("quality").value);

let pdf;

if(size==="a4"){

pdf=new jsPDF({
orientation:orientation,
unit:"mm",
format:"a4"
});

}

for(let i=0;i<files.length;i++){

const file=files[i];

const data=await readFile(file);

const img=await loadImage(data);

if(size==="original"){

const width=img.width*0.264583;
const height=img.height*0.264583;

if(i===0){

pdf=new jsPDF({
orientation:width>height?"landscape":"portrait",
unit:"mm",
format:[width,height]
});

}else{

pdf.addPage([width,height],
width>height?"landscape":"portrait");

}

pdf.addImage(
data,
file.type==="image/png"?"PNG":"JPEG",
0,
0,
width,
height,
undefined,
"FAST"
);

}else{

if(i>0)pdf.addPage();

const pageW=orientation==="portrait"?210:297;
const pageH=orientation==="portrait"?297:210;

const margin=10;

let w=pageW-margin*2;
let h=img.height*w/img.width;

if(h>pageH-margin*2){

h=pageH-margin*2;
w=img.width*h/img.height;

}

const x=(pageW-w)/2;
const y=(pageH-h)/2;

pdf.addImage(
data,
file.type==="image/png"?"PNG":"JPEG",
x,
y,
w,
h,
undefined,
"FAST"
);

}

}

pdf.save("The-Rock-PDF-Converter.pdf");

});

</script>

</body>
</html>
